name: YNAB alerts

on:
  schedule:
    # Hourly from 12:05 to 04:05 UTC, which covers 6-7am to 10-11pm in Chicago
    # across both CST and CDT. The script handles quiet hours and the 7am summary.
    - cron: "5 0-4,12-23 * * *"
  workflow_dispatch:
    inputs:
      force_summary:
        description: Send the daily summary now
        type: boolean
        default: true
      dry_run:
        description: Print the messages in the log instead of sending them
        type: boolean
        default: false

concurrency:
  group: ynab-alerts

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Remembers what was already sent (summary date, alerted categories) between runs.
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: ynab-state-${{ github.run_id }}
          restore-keys: ynab-state-

      - name: Run
        run: >-
          python ynab_alerts.py
          ${{ inputs.force_summary && '--force-summary' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          YNAB_TOKEN: ${{ secrets.YNAB_TOKEN }}
          YNAB_BUDGET_ID: ${{ secrets.YNAB_BUDGET_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          SUMMARY_HOUR: ${{ vars.SUMMARY_HOUR }}
          OVERSPEND_RULE: ${{ vars.OVERSPEND_RULE }}
          PENDING_LOOKBACK_DAYS: ${{ vars.PENDING_LOOKBACK_DAYS }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('.state/state.json') != ''
        with:
          path: .state
          key: ynab-state-${{ github.run_id }}-${{ github.run_attempt }}

